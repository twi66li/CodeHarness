[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codeharness"
version = "0.1.0"
description = "An inspectable Python coding-agent runtime"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
codeharness = "codeharness.cli:main"

[tool.setuptools.packages.find]
include = ["codeharness*"]
